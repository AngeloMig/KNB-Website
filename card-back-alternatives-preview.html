<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card Back Alternatives — KNB (internal)</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ef; --paper:#fff; --ink:#111110; --muted:#6d6c66; --line:#dedcd4;
    --pink:#e83fa0; --shop:#5e8e3e; --ac:#9fe27a; --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Satoshi",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
  .top{position:sticky;top:0;z-index:20;background:rgba(244,243,239,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-size:22px;font-weight:900}.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:3px}
  .tag{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .intro{padding:60px 0 24px;text-align:center}
  .intro .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
  .intro .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--shop)}
  .intro h1{font-size:clamp(32px,4.6vw,54px);font-weight:750;letter-spacing:-.03em;line-height:1.05;margin-top:16px}
  .intro p{font-size:16px;color:var(--muted);line-height:1.65;max-width:62ch;margin:16px auto 0}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px;padding:34px 0 90px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;max-width:360px;margin:0 auto}}
  .cell-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
  .cell-num{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--pink)}
  .cell-name{font-size:15px;font-weight:750}
  .cell-desc{font-size:12.5px;color:var(--muted);margin:0 2px 14px;line-height:1.5}

  /* ---- the card back face ---- */
  .cb{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;color:#fff;
      background:linear-gradient(160deg,#16271b,#1d3826 55%,#0f1d14);
      border:1px solid rgba(255,255,255,.14);box-shadow:0 32px 60px -38px rgba(0,0,0,.55);
      padding:22px 20px;display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
  .cb:hover{transform:translateY(-6px);box-shadow:0 42px 72px -38px rgba(0,0,0,.6)}
  .cb-wm{position:absolute;right:-30%;bottom:-16%;width:128%;opacity:.09;pointer-events:none;transform:rotate(-8deg)}
  .cb > :not(.cb-wm){position:relative;z-index:1}
  .cb-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;flex:none}
  .cb-logo img{width:22px;height:22px}
  .mut{color:rgba(255,255,255,.66)}
  .ac{color:var(--ac)}
  .kick{font-size:10.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
  .ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 01 spec sheet */
  .d-spec{justify-content:space-between}
  .spec-rows{display:flex;flex-direction:column;margin-top:18px}
  .spec-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid rgba(255,255,255,.13);font-size:13.5px}
  .spec-row span{color:rgba(255,255,255,.6)}.spec-row b{font-weight:750}
  .cb-foot{font-size:13px;color:rgba(255,255,255,.78);line-height:1.5;margin-top:16px}

  /* 02 big stat */
  .d-stat{justify-content:space-between}
  .stat-num{font-size:88px;font-weight:900;line-height:.9;letter-spacing:-.04em;margin-top:14px}
  .stat-lab{font-size:15px;font-weight:700;margin-top:6px}
  .stat-sub{font-size:12.5px;color:rgba(255,255,255,.66);margin-top:4px}
  .stat-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 9px}

  /* 03 checklist */
  .d-check h3,.d-grid h3,.d-proc h3,.d-tags h3,.d-vs h3{font-size:16px;font-weight:750;margin-top:16px}
  .check-list{display:flex;flex-direction:column;gap:11px;margin-top:14px}
  .check-list li{list-style:none;display:flex;gap:10px;font-size:13.5px;line-height:1.35;align-items:flex-start}
  .check-list .ico{color:var(--ac);margin-top:1px;flex:none}
  .cb-cta{display:inline-flex;align-items:center;gap:8px;margin-top:auto;font-size:13px;font-weight:850;color:var(--ac)}

  /* 04 mini process */
  .proc-steps{margin-top:18px;display:flex;flex-direction:column;gap:0}
  .proc-step{display:flex;gap:13px;padding-bottom:16px;position:relative}
  .proc-step:last-child{padding-bottom:0}
  .proc-step .pn{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--ac);color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:900;z-index:1}
  .proc-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:1px;background:rgba(255,255,255,.18)}
  .proc-step b{font-size:14px;font-weight:700}.proc-step small{display:block;color:rgba(255,255,255,.6);font-size:12px;margin-top:1px}

  /* 05 feature grid */
  .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .feat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:13px}
  .feat .ico{color:var(--ac);width:18px;height:18px}
  .feat b{display:block;font-size:12.5px;font-weight:700;margin-top:9px;line-height:1.2}

  /* 06 good for / not for */
  .vs-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .vs-col h4{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
  .vs-good h4{color:var(--ac)}.vs-bad h4{color:rgba(255,255,255,.5)}
  .vs-col li{list-style:none;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.85);padding-left:14px;position:relative;margin-bottom:5px}
  .vs-good li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
  .vs-bad li{color:rgba(255,255,255,.55)}.vs-bad li::before{content:"–";position:absolute;left:0;top:-1px;color:rgba(255,255,255,.4)}

  /* 07 metric chips */
  .d-chips .cb-title{font-size:21px;font-weight:750;margin-top:16px;line-height:1.1}
  .d-chips .cb-fit{font-size:13px;color:rgba(255,255,255,.72);margin-top:8px;line-height:1.5}
  .chip-row{display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .mchip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:11px;padding:9px 11px}
  .mchip b{font-size:15px;font-weight:900;color:var(--ac)}.mchip span{font-size:12px;color:rgba(255,255,255,.8)}

  /* 08 editorial */
  .d-edit{justify-content:space-between}
  .edit-q{font-size:24px;font-weight:650;line-height:1.18;letter-spacing:-.02em;margin-top:20px}
  .edit-q em{font-style:normal;color:var(--ac)}
  .edit-cap{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.6);text-transform:uppercase}

  /* 09 capability tags */
  .tag-cloud{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .tag-cloud span{font-size:12px;font-weight:700;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 11px}
  .d-tags .cb-foot{margin-top:auto}

  /* 10 highlights + cta */
  .hl{display:flex;gap:12px;padding:13px 0;border-top:1px solid rgba(255,255,255,.12)}
  .hl:first-of-type{margin-top:14px}
  .hl .hn{color:var(--ac);font-size:12px;font-weight:900;letter-spacing:.1em;flex:none}
  .hl b{font-size:13.5px;font-weight:700}.hl small{display:block;color:rgba(255,255,255,.6);font-size:12px;margin-top:1px}
  .hl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
  .hl-foot b{color:var(--ac);font-weight:850;font-size:13px}

  /* 11 ticket stub */
  .d-ticket{padding:0;justify-content:flex-start}
  .tk-top{padding:22px 20px 16px}
  .tk-eyebrow{font-size:10.5px;font-weight:900;letter-spacing:.2em;color:var(--ac)}
  .tk-title{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .tk-row{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7);margin-top:12px}
  .tk-perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.32);margin:6px 16px}
  .tk-perf::before,.tk-perf::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
  .tk-perf::before{left:-26px}.tk-perf::after{right:-26px}
  .tk-bot{padding:18px 20px 22px}
  .tk-barcode{height:36px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px);opacity:.85;border-radius:2px}
  .tk-foot{font-size:12px;color:rgba(255,255,255,.72);margin-top:12px}

  /* 12 terminal */
  .d-term{padding:0;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .tm-bar{display:flex;align-items:center;gap:6px;padding:12px 14px;background:rgba(0,0,0,.26);border-bottom:1px solid rgba(255,255,255,.1)}
  .tm-bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
  .tm-bar b{margin-left:8px;font-size:11px;font-weight:500;color:rgba(255,255,255,.55)}
  .tm-body{padding:18px 16px;font-size:12.5px;line-height:2}
  .tm-body .p,.tm-body .ok{color:var(--ac)}
  .tm-body .arr{color:#fff;font-weight:800}

  /* 13 receipt */
  .d-receipt{font-family:ui-monospace,"SF Mono",Menlo,monospace;justify-content:flex-start}
  .rc-head{text-align:center;font-size:13px;font-weight:700;letter-spacing:.18em;margin-top:8px}
  .rc-sub{text-align:center;font-size:10.5px;color:rgba(255,255,255,.55);margin-top:3px}
  .rc-line{border-top:1px dashed rgba(255,255,255,.3);margin:13px 0}
  .rc-item{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.85);margin:8px 0}
  .rc-item span:last-child{color:var(--ac)}
  .rc-total{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
  .rc-total b{color:var(--ac)}
  .rc-thanks{text-align:center;font-size:11px;color:rgba(255,255,255,.55);margin-top:14px}

  /* 14 work gallery */
  .d-gallery h3{font-size:16px;font-weight:750;margin-top:13px}
  .gal-grid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .gal-item{display:flex;gap:11px;align-items:center}
  .gal-thumb{width:64px;height:46px;border-radius:8px;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
  .gal-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .gal-item b{font-size:13px;font-weight:700}.gal-item small{display:block;font-size:11px;color:rgba(255,255,255,.55)}
  .d-gallery .cb-foot{margin-top:auto}

  /* 15 seal */
  .d-seal{align-items:center;justify-content:center;text-align:center}
  .seal{position:relative;width:172px;height:172px}
  .seal svg{position:absolute;inset:0;width:100%;height:100%}
  .seal-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .seal-mid b{font-size:42px;font-weight:900;line-height:1;color:var(--ac)}
  .seal-mid span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:4px}
  .seal-cap{font-size:12px;color:rgba(255,255,255,.7);margin-top:18px;max-width:24ch}

  /* 16 timeline */
  .d-timeline h3{font-size:15px;font-weight:750;margin-top:13px}
  .tl{position:relative;margin-top:auto;padding-top:6px}
  .tl::before{content:"";position:absolute;left:11%;right:11%;top:11px;height:2px;background:rgba(255,255,255,.22)}
  .tl-dots{display:flex;justify-content:space-between;position:relative}
  .tl-dot{display:flex;flex-direction:column;align-items:center;gap:10px;width:25%}
  .tl-dot i{width:12px;height:12px;border-radius:50%;background:var(--ac)}
  .tl-dot span{font-size:10.5px;font-weight:650;color:rgba(255,255,255,.8);text-align:center}

  /* 17 chat */
  .d-chat{justify-content:flex-start;gap:10px}
  .d-chat .kick{margin-bottom:4px}
  .bubble{max-width:86%;padding:11px 14px;font-size:13px;line-height:1.4;border-radius:16px}
  .bub-in{align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-bottom-left-radius:5px}
  .bub-out{align-self:flex-end;background:var(--ac);color:#10260f;font-weight:600;border-bottom-right-radius:5px}
  .chat-foot{margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.55)}

  /* 18 sticky notes */
  .d-sticky{align-items:center;justify-content:center;overflow:hidden}
  .sticky-wrap{position:relative;width:100%;height:100%}
  .note{position:absolute;top:50%;left:50%;width:122px;padding:14px;border-radius:3px;font-size:13px;font-weight:600;color:#1a1a17;box-shadow:0 12px 26px rgba(0,0,0,.32)}
  .note small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:5px}
  .note1{background:#f3e9a8;transform:translate(-50%,-50%) rotate(-7deg) translate(-44px,-34px)}
  .note2{background:#bfe3a0;transform:translate(-50%,-50%) rotate(5deg) translate(46px,-4px)}
  .note3{background:#f5c9a0;transform:translate(-50%,-50%) rotate(-3deg) translate(-6px,54px)}

  /* 19 boarding pass */
  .d-board{padding:0;font-family:ui-monospace,"SF Mono",Menlo,monospace;justify-content:flex-start}
  .bp-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 14px;border-bottom:1px dashed rgba(255,255,255,.25)}
  .bp-head b{font-size:13px;font-weight:800;letter-spacing:.1em}
  .bp-head span{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.08em}
  .bp-route{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:10px}
  .bp-pt small{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase}
  .bp-pt b{display:block;font-size:17px;font-weight:800;margin-top:3px}
  .bp-arrow{color:var(--ac);font-size:18px}
  .bp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 14px}
  .bp-grid small{font-size:8.5px;letter-spacing:.08em;color:rgba(255,255,255,.5);text-transform:uppercase;display:block}
  .bp-grid b{font-size:12px;font-weight:700}
  .bp-bar{margin:0 16px 16px;height:30px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 6px,transparent 6px 9px);opacity:.8;border-radius:2px}

  /* 20 magazine cover */
  .d-mag{justify-content:space-between}
  .mag-top{display:flex;justify-content:space-between;align-items:flex-start}
  .mag-masthead{font-size:48px;font-weight:900;letter-spacing:-.04em;line-height:.85}
  .mag-issue{font-size:9.5px;color:rgba(255,255,255,.55);text-align:right;letter-spacing:.06em;line-height:1.5}
  .mag-lines{margin-top:auto}
  .mag-line{font-size:15px;font-weight:700;line-height:1.25;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
  .mag-line em{font-style:normal;color:var(--ac)}
  .mag-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .mag-foot small{font-size:10px;color:rgba(255,255,255,.5)}
  .mag-bar{width:54px;height:22px;background:repeating-linear-gradient(90deg,#fff 0 1.5px,transparent 1.5px 3px);opacity:.7}
</style>
</head>
<body>
  <div class="top"><div class="wrap"><span class="logo">KNB<i></i></span><span class="tag">Card Back Designs · Internal</span></div></div>

  <header class="intro"><div class="wrap">
    <span class="eyebrow">Preview · Internal</span>
    <h1>Twenty card-back designs.</h1>
    <p>Shown on the Shopify card as the example — each layout applies to all three platforms (Webflow, WordPress) with their own colour, proof number, and copy. Tell me the number you want and I'll wire it into the hero cards.</p>
  </div></header>

  <main class="wrap"><div class="grid" id="grid"></div></main>

  <script>
    const WM = 'https://cdn.simpleicons.org/shopify/ffffff';
    const LOGO = '<span class="cb-logo"><img src="https://cdn.simpleicons.org/shopify/ffffff" alt=""></span>';
    const wm = '<img class="cb-wm" src="'+WM+'" alt="">';
    const I = {
      check:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
      cart:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6h15l-2 8H8L6 3H3"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>',
      bolt:'<svg class="ico" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
      search:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
      shield:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-5"/></svg>',
      arrow:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
    };

    const DESIGNS = [
      { name:'Spec Sheet', desc:'Scannable label/value rows — reads like a product spec.', cls:'d-spec',
        html: LOGO + '<div class="spec-rows">'+
          '<div class="spec-row"><span>Platform</span><b>Shopify</b></div>'+
          '<div class="spec-row"><span>Best for</span><b>Online stores</b></div>'+
          '<div class="spec-row"><span>Delivered</span><b>6 stores</b></div>'+
          '<div class="spec-row"><span>Approach</span><b>Scope first</b></div>'+
        '</div><p class="cb-foot">Clean product pages and an easy path to checkout.</p>' },

      { name:'Big Stat', desc:'Lead with the proof number — confident and instant.', cls:'d-stat',
        html: '<span class="kick">Delivered</span><div><div class="stat-num">6</div><div class="stat-lab">Shopify stores shipped</div><div class="stat-sub">Built, revamped & launched end to end.</div></div>'+
          '<div class="stat-tags"><span class="pill">Online stores</span><span class="pill">Scope first</span></div>' },

      { name:'Included Checklist', desc:'What every build includes + a soft link to work.', cls:'d-check',
        html: '<span class="kick">What’s included</span><h3>Shopify &amp; Ecommerce</h3>'+
          '<ul class="check-list"><li>'+I.check+'Custom storefront design</li><li>'+I.check+'Conversion-focused product pages</li><li>'+I.check+'Cart &amp; checkout setup</li></ul>'+
          '<a class="cb-cta">See Shopify work '+I.arrow+'</a>' },

      { name:'Mini Process', desc:'How a project flows — calms the “what happens next?”.', cls:'d-proc',
        html: '<span class="kick">How it goes</span>'+
          '<div class="proc-steps">'+
          '<div class="proc-step"><span class="pn">1</span><div><b>Free consultation</b><small>We learn your goals</small></div></div>'+
          '<div class="proc-step"><span class="pn">2</span><div><b>Written proposal</b><small>Clear scope, no surprises</small></div></div>'+
          '<div class="proc-step"><span class="pn">3</span><div><b>Design &amp; launch</b><small>Built, tested, shipped</small></div></div>'+
          '</div>' },

      { name:'Feature Grid', desc:'2×2 tiles of what you get — visual and quick to scan.', cls:'d-grid',
        html: '<span class="kick">Shopify builds</span><h3>What you get</h3>'+
          '<div class="feat-grid">'+
          '<div class="feat">'+I.cart+'<b>Custom design</b></div>'+
          '<div class="feat">'+I.bolt+'<b>Fast &amp; mobile</b></div>'+
          '<div class="feat">'+I.search+'<b>SEO setup</b></div>'+
          '<div class="feat">'+I.shield+'<b>Care after launch</b></div>'+
          '</div>' },
