<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="KNB project preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1a"/>
      <stop offset="1" stop-color="#0d0d0b"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#dots)"/>
  <g text-anchor="middle" font-family="'Satoshi',system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="360" y="232" font-size="52" font-weight="900" letter-spacing="1" fill="#ffffff">KNB<tspan fill="#e83fa0">.</tspan></text>
    <text x="360" y="272" font-size="15" font-weight="600" letter-spacing="3" fill="#8b897f">PROJECT PREVIEW</text>
  </g>
</svg>
