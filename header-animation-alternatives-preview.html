<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Header Animation Alternatives — KNB (internal)</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ef; --paper:#fff; --ink:#111110; --muted:#6d6c66; --line:#dedcd4;
    --pink:#e83fa0; --shop:#5e8e3e; --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Satoshi",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  .top{position:sticky;top:0;z-index:20;background:rgba(244,243,239,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-size:22px;font-weight:900;line-height:1}.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:3px}
  .tag{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .intro{padding:66px 0 30px;text-align:center}
  .intro .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
  .intro .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--shop)}
  .intro h1{font-size:clamp(34px,5vw,58px);font-weight:750;letter-spacing:-.03em;line-height:1.04;margin-top:18px}
  .intro p{font-size:16px;color:var(--muted);line-height:1.65;max-width:60ch;margin:18px auto 0}

  .opt{padding:30px 0;border-top:1px solid var(--line)}
  .opt:first-of-type{border-top:none}
  .opt-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
  .opt-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .opt-num{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--pink)}
  .opt h2{font-size:22px;font-weight:750}
  .opt-desc{font-size:13.5px;color:var(--muted);max-width:46ch}
  .replay{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;transition:border-color .25s,background .25s}
  .replay:hover{border-color:var(--ink)}
  .replay svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--bg);padding:clamp(34px,6vw,72px);box-shadow:0 30px 80px -68px rgba(17,17,16,.55);min-height:230px;display:flex;align-items:center}
  .stage.grid{background-image:linear-gradient(rgba(17,17,16,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,16,.045) 1px,transparent 1px);background-size:46px 46px}
  .h-demo{font-size:clamp(30px,5vw,58px);font-weight:750;letter-spacing:-.025em;line-height:1.06;max-width:18ch;color:var(--ink)}
  .h-word{display:inline-block}
  .h-char{display:inline-block;will-change:transform}
  .h-mask{display:inline-block;overflow:hidden;vertical-align:top}
  .h-mask-in{display:inline-block}
  .perspective{perspective:700px}
  .replay-all{display:block;margin:8px auto 80px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 22px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  @media(max-width:680px){.opt-head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
  <div class="top"><div class="wrap"><span class="logo">KNB<i></i></span><span class="tag">Header Animations · Internal</span></div></div>

  <header class="intro"><div class="wrap">
    <span class="eyebrow">Preview · Internal</span>
    <h1>Ten header entrance animations.</h1>
    <p>Same headline, ten different on-load reveals. Hover a card and hit <b>Replay</b> to watch it again. Tell me the number you want and I'll wire it into the homepage hero.</p>
  </div></header>

  <main class="wrap" id="opts"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const TEXT = 'Shopify, Webflow & WordPress, built to last.';
    const OPTS = [
      { id:'rise',   name:'Rise Up',        grid:true,  desc:'The current hero pick — the whole line fades and lifts into place. Calm and premium.' },
      { id:'words',  name:'Word Stagger',   grid:false, desc:'Each word rises in sequence. Adds rhythm without feeling busy.' },
      { id:'letters',name:'Letter Stagger', grid:false, desc:'Per-letter rise (the old typewriter feel). More energetic, more motion.' },
      { id:'mask',   name:'Mask Reveal',    grid:true,  desc:'The headline slides up from behind a clean edge. Editorial and confident.' },
      { id:'blur',   name:'Blur In',        grid:false, desc:'Comes into focus from a soft blur. Cinematic, modern.' },
      { id:'zoom',   name:'Zoom In',        grid:true,  desc:'Scales up subtly from the left as it fades in. Bold first impression.' },
      { id:'slide',  name:'Slide From Left',grid:false, desc:'Words sweep in from the left in a quick stagger. Directional, decisive.' },
      { id:'flip',   name:'Letter Flip 3D', grid:false, desc:'Letters flip up on an X axis. Playful and eye-catching.' },
      { id:'wipe',   name:'Clip Wipe',      grid:true,  desc:'A reveal that wipes across left to right, like ink drawing on. Distinctive.' },
      { id:'spring', name:'Spring Pop',     grid:false, desc:'Words pop in with a springy overshoot. The most characterful of the set.' },
    ];

    const main = document.getElementById('opts');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    OPTS.forEach((o, i) => {
      const sec = document.createElement('section');
      sec.className = 'opt';
      const num = String(i+1).padStart(2,'0');
      sec.innerHTML =
        '<div class="opt-head"><div class="opt-title"><span class="opt-num">'+num+'</span><h2>'+o.name+'</h2>'+
        '<p class="opt-desc">'+o.desc+'</p></div>'+
        '<button class="replay" data-id="'+o.id+'"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Replay</button></div>'+
        '<div class="stage'+(o.grid?' grid':'')+(o.id==='flip'?' perspective':'')+'"><h2 class="h-demo" id="h-'+o.id+'">'+TEXT+'</h2></div>';
      main.appendChild(sec);
    });
    const all = document.createElement('button');
    all.className='replay-all'; all.textContent='▶  Replay all';
    main.appendChild(all);

    /* ---- split helpers (run once per element) ---- */
    function splitWords(el){
      if(el.dataset.split) return [...el.querySelectorAll('.h-word')];
      const words = el.textContent.split(' ');
      el.textContent='';
      const out=[];
      words.forEach((w,i)=>{ const s=document.createElement('span'); s.className='h-word'; s.textContent=w; el.appendChild(s); out.push(s); if(i<words.length-1) el.appendChild(document.createTextNode(' ')); });
      el.dataset.split='1'; return out;
    }
    function splitChars(el){
      if(el.dataset.split) return [...el.querySelectorAll('.h-char')];
      const words = el.textContent.split(' ');
      el.textContent='';
      const out=[];
      words.forEach((w,wi,arr)=>{ const wEl=document.createElement('span'); wEl.className='h-word';
        [...w].forEach(ch=>{ const c=document.createElement('span'); c.className='h-char'; c.textContent=ch; wEl.appendChild(c); out.push(c); });
        el.appendChild(wEl); if(wi<arr.length-1) el.appendChild(document.createTextNode(' '));
      });
      el.dataset.split='1'; return out;
    }
    function wrapMask(el){
      if(el.dataset.split) return el.querySelector('.h-mask-in');
      const txt=el.textContent; el.textContent='';
      const mask=document.createElement('span'); mask.className='h-mask';
      const inner=document.createElement('span'); inner.className='h-mask-in'; inner.textContent=txt;
      mask.appendChild(inner); el.appendChild(mask);
      el.dataset.split='1'; return inner;
    }

    /* ---- animations ---- */
    const ANIM = {
      rise(el){ gsap.fromTo(el,{y:46,autoAlpha:0},{y:0,autoAlpha:1,duration:.95,ease:'power3.out'}); },
      words(el){ const w=splitWords(el); gsap.fromTo(w,{yPercent:110,autoAlpha:0},{yPercent:0,autoAlpha:1,duration:.8,ease:'power3.out',stagger:.08}); },
      letters(el){ const c=splitChars(el); gsap.fromTo(c,{yPercent:120,autoAlpha:0},{yPercent:0,autoAlpha:1,duration:.7,ease:'power4.out',stagger:.022}); },
      mask(el){ const inner=wrapMask(el); gsap.fromTo(inner,{yPercent:110},{yPercent:0,duration:1,ease:'power4.out'}); },
      blur(el){ gsap.fromTo(el,{autoAlpha:0,filter:'blur(16px)',y:16},{autoAlpha:1,filter:'blur(0px)',y:0,duration:1.05,ease:'power2.out'}); },
      zoom(el){ gsap.fromTo(el,{scale:.8,autoAlpha:0,transformOrigin:'left center'},{scale:1,autoAlpha:1,duration:.9,ease:'power3.out'}); },
      slide(el){ const w=splitWords(el); gsap.fromTo(w,{x:-46,autoAlpha:0},{x:0,autoAlpha:1,duration:.72,ease:'power3.out',stagger:.06}); },
      flip(el){ const c=splitChars(el); gsap.fromTo(c,{rotationX:-92,autoAlpha:0,transformOrigin:'50% 100% -16px'},{rotationX:0,autoAlpha:1,duration:.7,ease:'back.out(1.5)',stagger:.02}); },
      wipe(el){ gsap.fromTo(el,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.05,ease:'power3.inOut'}); },
      spring(el){ const w=splitWords(el); gsap.fromTo(w,{scale:.55,autoAlpha:0,yPercent:30},{scale:1,autoAlpha:1,yPercent:0,duration:.85,ease:'back.out(1.8)',stagger:.08}); },
    };

    function play(id){ const el=document.getElementById('h-'+id); if(!el) return; if(reduce){ gsap.set(el,{clearProps:'all'}); return; } ANIM[id](el); }

    document.querySelectorAll('.replay').forEach(b=>b.addEventListener('click',()=>play(b.dataset.id)));
    all.addEventListener('click',()=>OPTS.forEach((o,i)=>setTimeout(()=>play(o.id), i*120)));

    /* autoplay each when it scrolls into view (once) */
    const seen=new Set();
    const io=new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.querySelector('.h-demo').id.slice(2); if(!seen.has(id)){ seen.add(id); play(id); } } }),{threshold:.5});
    document.querySelectorAll('.stage').forEach(s=>io.observe(s));
  </script>
</body>
</html>
