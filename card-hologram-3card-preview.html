<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sparkle Holo — 3 platform cards (internal)</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
  @property --drift{syntax:'<percentage>';initial-value:0%;inherits:false}
  @keyframes drift{from{--drift:-36%}to{--drift:36%}}
  @keyframes twinkle{0%{opacity:.35}100%{opacity:1}}
  :root{--bg:#f4f3ef;--ink:#111110;--muted:#6d6c66;--line:#dedcd4;--pink:#e83fa0;--shop:#5e8e3e;--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Satoshi",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}
  .top{position:sticky;top:0;z-index:20;background:rgba(244,243,239,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-size:22px;font-weight:900}.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:3px}
  .tag{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .intro{padding:60px 0 10px;text-align:center}
  .intro .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
  .intro .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--shop)}
  .intro h1{font-size:clamp(32px,4.6vw,52px);font-weight:750;letter-spacing:-.03em;line-height:1.05;margin-top:16px}
  .intro p{font-size:16px;color:var(--muted);line-height:1.65;max-width:58ch;margin:16px auto 0}

  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:54px 0 100px;justify-items:center;align-items:start}
  @media(max-width:860px){.row{grid-template-columns:1fr;max-width:340px;margin:0 auto}}
  .cell{width:100%;max-width:330px}

  /* ---- card (Sparkle Holo) ---- */
  .holo{display:block;position:relative;aspect-ratio:4/5;border-radius:26px;overflow:hidden;isolation:isolate;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 34px 66px -34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -22px 50px rgba(0,0,0,.22);
    transition:transform .15s ease, box-shadow .14s ease;--mx:50%;--my:50%;--px:0;--py:0;will-change:transform;text-decoration:none}
  .holo:hover{box-shadow:0 50px 88px -38px rgba(0,0,0,.62)}
  .shop{background:linear-gradient(160deg,#16271b,#1d3826 55%,#0f1d14);--ac:#9fe27a}
  .web{background:linear-gradient(160deg,#141a3a,#1d2861 55%,#0d1330);--ac:#93a0ff}
  .wp{background:linear-gradient(160deg,#0f2531,#16384a 55%,#0a1922);--ac:#5ec4e8}

  /* big faint platform watermark (same as the real card front) — recedes on tilt (parallax) */
  .holo-wm{position:absolute;z-index:1;width:142%;height:auto;right:-32%;bottom:-16%;opacity:.17;pointer-events:none;transition:transform .12s ease;
    transform:rotate(-8deg) translate(calc(var(--px) * -28px), calc(var(--py) * -19px))}
  /* cursor-tracked glare streak — the bright bar of light real foil catches */
  .holo-glare{position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .35s var(--ease);
    background:linear-gradient(102deg,transparent 40%,rgba(120,200,255,.42) 45.5%,rgba(255,255,255,.6) 48%,rgba(255,255,255,1) 50%,rgba(255,255,255,.6) 52%,rgba(255,140,205,.42) 54.5%,transparent 60%);
    background-size:300% 100%;background-position:calc(var(--mx) * 1.6 - 30%) 0}
  .holo:hover .holo-glare{opacity:.95}
  /* rainbow foil */
  .holo-fx{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;mix-blend-mode:color-dodge;opacity:.5;animation:drift 6s ease-in-out infinite alternate;
    background:linear-gradient(115deg,transparent 16%,rgba(255,94,138,.5),rgba(255,216,111,.5),rgba(94,255,160,.5),rgba(94,200,255,.5),rgba(177,140,255,.5),transparent 84%);
    background-size:240% 100%;background-position:calc(120% - var(--mx)*1.6 + var(--drift)) 0}
  .holo:hover .holo-fx,.holo:hover::after{animation-play-state:paused}
  /* twinkling glints */
  .holo::after,.holo::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  .holo::after{
    background-image:
      radial-gradient(circle, rgba(255,255,255,.98) 0.6px, rgba(255,255,255,.3) 1.6px, transparent 3px),
      radial-gradient(circle, rgba(190,225,255,.92) 0.5px, transparent 2px);
    background-size:70px 70px, 46px 46px;background-position:9px 7px, 31px 35px;
    animation:twinkle 2.7s ease-in-out infinite alternate}
  .holo::before{
    background-image:
      radial-gradient(circle, rgba(255,255,255,.95) 0.7px, rgba(255,210,240,.32) 1.7px, transparent 3.2px),
      radial-gradient(circle, rgba(255,200,230,.88) 0.5px, transparent 1.9px);
    background-size:96px 96px, 60px 60px;background-position:50px 22px, 14px 62px;
    animation:twinkle 4s ease-in-out infinite alternate-reverse;animation-delay:.7s}
  /* readability scrim */
  .holo-scrim{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
    background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 44%,rgba(0,0,0,.7) 100%)}
  /* bright cursor glow — lights up the glitter beneath it where the "light" hits */
  .holo-spec{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;mix-blend-mode:screen;opacity:.35;transition:opacity .3s;
    background:radial-gradient(220px circle at var(--mx) var(--my),rgba(255,255,255,.4),rgba(255,255,255,.08) 38%,transparent 62%)}
  .holo:hover .holo-spec{opacity:.9}

  .holo-content{position:relative;z-index:4;height:100%;padding:24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.45);transition:transform .12s ease;
    transform:translate(calc(var(--px) * 9px), calc(var(--py) * 6px))}
  .holo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .holo-logo{width:52px;height:52px;border-radius:15px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.34);display:grid;place-items:center;flex:none;backdrop-filter:blur(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.3)}
  .holo-logo img{width:27px;height:27px}
  .holo-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 10px;backdrop-filter:blur(4px)}
  .holo-badge i{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
  .holo-bottom b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .holo-desc{display:block;color:rgba(255,255,255,.8);font-size:13.5px;margin-top:7px;line-height:1.35;max-width:24ch}
  .holo-feats{display:inline-flex;gap:7px;margin-top:14px}
  .holo-feat{width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;backdrop-filter:blur(3px)}
  .holo-feat svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* shimmering holographic foil border (like real foil-edged cards) */
  .holo-frame{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;padding:1.5px;mix-blend-mode:screen;opacity:.55;animation:drift 5s ease-in-out infinite alternate;
    background:linear-gradient(115deg,rgba(255,94,138,.85),rgba(255,216,111,.85),rgba(94,255,160,.85),rgba(94,200,255,.85),rgba(177,140,255,.85));
    background-size:240% 100%;background-position:calc(120% - var(--mx)*1.6 + var(--drift)) 0;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
  .holo:hover .holo-frame{opacity:.9}
  @media(prefers-reduced-motion:reduce){.holo-fx,.holo-frame,.holo::after,.holo::before{animation:none!important}}
</style>
</head>
<body>
  <div class="top"><div class="wrap"><span class="logo">KNB<i></i></span><span class="tag">Sparkle Holo · 3 cards · Internal</span></div></div>

  <header class="intro"><div class="wrap">
    <span class="eyebrow">Preview · Internal</span>
    <h1>Sparkle Holo — all three platforms.</h1>
    <p>The #09 look applied to each hero card with its own platform tint, logo, proof, and copy. Hover any card for the shimmer + tilt. This is exactly how they'll look in the hero.</p>
  </div></header>

  <main class="wrap"><div class="row" id="row"></div></main>

  <script>
    const I = {
      cart:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.4 12.3a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.3L23 7H6"/></svg>',
      card:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
      mobile:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
      pencil:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      cms:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
      resp:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="14" height="12" rx="1"/><rect x="16" y="8" width="6" height="12" rx="1"/></svg>',
      pages:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>',
      growth:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
      shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-5"/></svg>'
    };
    const CARDS = [
      { cls:'shop', logo:'shopify', name:'Shopify', desc:'Store revamps &amp; ecommerce builds', proof:'6 stores shipped', href:'shopify.html', feats:['cart','card','mobile'] },
      { cls:'web',  logo:'webflow', name:'Webflow', desc:'Custom website design', proof:'10 sites built', href:'webflow.html', feats:['pencil','cms','resp'] },
      { cls:'wp',   logo:'wordpress', name:'WordPress', desc:'WooCommerce &amp; business sites', proof:'28 sites built', href:'wordpress.html', feats:['cms','pages','shield'] },
    ];
    document.getElementById('row').innerHTML = CARDS.map(c=>{
      const feats = '<span class="holo-feats">'+c.feats.map(f=>'<span class="holo-feat">'+I[f]+'</span>').join('')+'</span>';
      return '<div class="cell"><a class="holo '+c.cls+'" href="'+c.href+'" data-holo aria-label="'+c.name+'">'+
        '<img class="holo-wm" src="https://cdn.simpleicons.org/'+c.logo+'/ffffff" alt="">'+
        '<div class="holo-fx"></div><div class="holo-glare"></div><div class="holo-scrim"></div><div class="holo-spec"></div>'+
        '<div class="holo-content">'+
          '<div class="holo-top"><span class="holo-logo"><img src="https://cdn.simpleicons.org/'+c.logo+'/ffffff" alt="'+c.name+'"></span>'+
          '<span class="holo-badge"><i></i>'+c.proof+'</span></div>'+
          '<div class="holo-bottom"><b>'+c.name+'</b><span class="holo-desc">'+c.desc+'</span>'+feats+'</div>'+
        '</div><div class="holo-frame"></div></a></div>';
    }).join('');

    document.querySelectorAll('[data-holo]').forEach(c=>{
      c.addEventListener('mousemove',e=>{
        const r=c.getBoundingClientRect();
        const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        c.style.setProperty('--mx',(px*100)+'%'); c.style.setProperty('--my',(py*100)+'%');
        c.style.setProperty('--px',(px-.5).toFixed(3)); c.style.setProperty('--py',(py-.5).toFixed(3));
        c.style.transform='perspective(820px) rotateY('+((px-.5)*15)+'deg) rotateX('+(-(py-.5)*15)+'deg)';
        // dynamic shadow — shifts opposite the tilt so the card feels lifted off the page
        const ox=(.5-px)*46, oy=46+(.5-py)*30;
        c.style.boxShadow=ox.toFixed(1)+'px '+oy.toFixed(1)+'px 82px -34px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -22px 50px rgba(0,0,0,.22)';
      });
      c.addEventListener('mouseleave',()=>{c.style.transform='';c.style.boxShadow='';c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%');c.style.setProperty('--px','0');c.style.setProperty('--py','0');});
    });
  </script>
</body>
</html>
